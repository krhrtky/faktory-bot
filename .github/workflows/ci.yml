name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate jOOQ code
      run: ./gradlew generateJooq

    - name: Run ktlint
      run: ./gradlew ktlintCheck

    - name: Run detekt
      run: ./gradlew detekt

    - name: Upload detekt results
      if: always()
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: faktory-core/build/reports/detekt/detekt.sarif
      continue-on-error: true

  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build -x test

    - name: Run unit tests
      run: ./gradlew test --no-daemon

    - name: Generate coverage report
      if: always()
      run: ./gradlew jacocoTestReport

    - name: Verify coverage threshold
      run: ./gradlew jacocoTestCoverageVerification

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: |
          **/build/test-results/test/*.xml
          **/build/reports/tests/test/

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports
        path: |
          **/build/reports/jacoco/test/html/
          **/build/reports/jacoco/test/jacocoTestReport.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./faktory-core/build/reports/jacoco/test/jacocoTestReport.xml
        fail_ci_if_error: false
        flags: unittests
        name: codecov-umbrella

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint-and-format, build-and-test]
    if: always()

    steps:
    - name: Check quality gate
      run: |
        if [[ "${{ needs.lint-and-format.result }}" != "success" ]]; then
          echo "❌ Lint and format checks failed"
          exit 1
        fi
        if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
          echo "❌ Build and tests failed"
          exit 1
        fi
        echo "✅ All quality gates passed"
