name: Integration Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  integration-tests:
    name: Integration Tests (${{ matrix.database }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        database: [mysql]
        include:
          - database: mysql
            db-image: mysql:8.0
            db-port: 3306
            db-env: |
              MYSQL_DATABASE=faktory_test
              MYSQL_USER=test
              MYSQL_PASSWORD=test
              MYSQL_ROOT_PASSWORD=root
            health-cmd: mysqladmin ping

    services:
      database:
        image: ${{ matrix.db-image }}
        env:
          ${{ matrix.db-env }}
        options: >-
          --health-cmd "${{ matrix.health-cmd }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - ${{ matrix.db-port }}:${{ matrix.db-port }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run integration tests - ${{ matrix.database }}
      run: ./gradlew test --tests '*IntegrationTest' --no-daemon
      env:
        DB_TYPE: ${{ matrix.database }}
        DB_HOST: localhost
        DB_PORT: ${{ matrix.db-port }}
        DB_NAME: faktory_test
        DB_USER: test
        DB_PASSWORD: test

    - name: Upload test results - ${{ matrix.database }}
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: integration-test-results-${{ matrix.database }}
        path: |
          **/build/test-results/test/*.xml
          **/build/reports/tests/test/

  integration-summary:
    name: Integration Tests Summary
    runs-on: ubuntu-latest
    needs: integration-tests
    if: always()

    steps:
    - name: Check integration test results
      run: |
        if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
          echo "❌ Integration tests failed"
          exit 1
        fi
        echo "✅ All integration tests passed"
