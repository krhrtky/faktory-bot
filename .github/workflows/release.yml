name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Validate version
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        GRADLE_VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}' | sed 's/-SNAPSHOT//')
        echo "Tag version: $TAG_VERSION"
        echo "Gradle version: $GRADLE_VERSION"
        if [[ "$TAG_VERSION" != "$GRADLE_VERSION" ]]; then
          echo "❌ Version mismatch! Tag: $TAG_VERSION, Gradle: $GRADLE_VERSION"
          exit 1
        fi

    - name: Run quality checks
      run: |
        ./gradlew ktlintCheck detekt
        ./gradlew test jacocoTestCoverageVerification

    - name: Build artifacts
      run: ./gradlew clean build -x test

    - name: Build documentation
      run: ./gradlew dokkaHtml
      continue-on-error: true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: release-artifacts
        path: |
          **/build/libs/*.jar
          !**/*-javadoc.jar
          !**/*-sources.jar

  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Publish to GitHub Packages
      run: ./gradlew publish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
      continue-on-error: true

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v3
      with:
        name: release-artifacts
        path: artifacts

    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Generate changelog
      id: changelog
      run: |
        if [ -f CHANGELOG.md ]; then
          # Extract changelog for this version
          CHANGELOG=$(awk '/^## \['"${{ steps.version.outputs.version }}"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release version ${{ steps.version.outputs.version }}"
          fi
        else
          # Generate changelog from git commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi
        fi
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release v${{ steps.version.outputs.version }}
        body: |
          ## What's Changed

          ${{ steps.changelog.outputs.changelog }}

          ## Installation

          ### Gradle (Kotlin DSL)
          ```kotlin
          dependencies {
              testImplementation("com.example:faktory-bot:${{ steps.version.outputs.version }}")
          }
          ```

          ### Maven
          ```xml
          <dependency>
              <groupId>com.example</groupId>
              <artifactId>faktory-bot</artifactId>
              <version>${{ steps.version.outputs.version }}</version>
              <scope>test</scope>
          </dependency>
          ```

          ## Documentation

          - [Quick Start Guide](https://github.com/${{ github.repository }}/blob/v${{ steps.version.outputs.version }}/QUICKSTART.md)
          - [README](https://github.com/${{ github.repository }}/blob/v${{ steps.version.outputs.version }}/README.md)
        files: |
          artifacts/**/*.jar
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
